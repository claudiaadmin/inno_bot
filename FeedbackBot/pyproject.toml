[project]
name = "feedbackbot"
version = "0.2.0"
description = ""
authors = [{ name = "Claudia Dresselhaus" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai >= 1.41.0",
    "uvicorn >= 0.30.6",
    "fastapi >= 0.112.1",
    "python-multipart >= 0.0.9",
    "python-ulid >= 2.7.0",
    "ffmpeg-python >= 0.2.0",
    "python-dotenv >= 1.0.1",
    "pypugjs >= 5.11.0",
    "jinja2 >= 3.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
feedbackbot = "feedbackbot:app"